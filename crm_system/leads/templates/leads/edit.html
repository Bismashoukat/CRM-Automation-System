<h2>Edit Lead</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="name" value="{{ lead.name }}" placeholder="Name"><br><br>
    <input type="email" name="email" value="{{ lead.email }}" placeholder="Email"><br><br>
    <input type="text" name="phone" value="{{ lead.phone }}" placeholder="Phone"><br><br>
    <input type="text" name="company" value="{{ lead.company }}" placeholder="Company"><br><br>
    <textarea name="message">{{ lead.message }}</textarea><br><br>

    <button type="submit">Update</button>
</form>
