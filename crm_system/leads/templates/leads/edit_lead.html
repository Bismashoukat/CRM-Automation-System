<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <title>Edit Lead</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root[data-theme="light"] {
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --muted: #6c757d;
            --border: #e0e0e0;
            --input-bg: #f8f9ff;
            --input-focus: #ffffff;
        }
        :root[data-theme="dark"] {
            --bg: #0f0f1a;
            --card: #1e1e2e;
            --text: #e0e0f0;
            --muted: #9090a0;
            --border: #2e2e4e;
            --input-bg: #252538;
            --input-focus: #2e2e48;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.2s; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TOPBAR */
        .topbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: #4f46e5;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-btn {
            width: 36px; height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
        }

        /* LAYOUT */
        .page-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .form-card {
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }

        /* CARD HEADER */
        .card-header {
            background: linear-gradient(135deg, #059669, #0d9488);
            padding: 28px 36px;
            color: white;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-avatar {
            width: 52px; height: 52px;
            border-radius: 14px;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .card-header h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 3px; }
        .card-header p  { opacity: 0.85; font-size: 0.85rem; }

        /* FORM BODY */
        .card-body { padding: 32px 36px; }

        .field-group { margin-bottom: 18px; }
        .field-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 7px;
        }
        .field-wrap { position: relative; }
        .field-icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1rem;
            pointer-events: none;
        }
        .field-icon.top { top: 14px; transform: none; }

        input, textarea, select {
            width: 100%;
            background: var(--input-bg);
            border: 1.5px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 11px 14px 11px 40px;
            font-size: 0.92rem;
            outline: none;
            font-family: inherit;
            appearance: none;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #059669;
            background: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(5,150,105,0.12);
        }
        textarea { height: 100px; resize: vertical; padding-top: 12px; }
        select { cursor: pointer; padding-right: 36px; }
        .select-arrow {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        /* STATUS COLORS */
        .status-new       { color: #d97706; }
        .status-contacted { color: #2563eb; }
        .status-progress  { color: #db2777; }
        .status-converted { color: #059669; }

        /* ROW */
        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* DIVIDER */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 20px 0;
        }

        /* BUTTONS */
        .btn-row { display: flex; gap: 10px; margin-top: 6px; }
        .submit-btn {
            flex: 1;
            padding: 13px;
            background: linear-gradient(135deg, #059669, #0d9488);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 8px;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #047857, #0f766e);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(5,150,105,0.35);
        }
        .cancel-btn {
            padding: 13px 20px;
            background: transparent;
            color: var(--muted);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: flex; align-items: center; gap: 6px;
        }
        .cancel-btn:hover { border-color: #dc2626; color: #dc2626; }

        @media (max-width: 480px) {
            .card-header, .card-body { padding: 22px 18px; }
            .field-row { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <a href="{% url 'dashboard' %}" class="brand">
        <i class="bi bi-diagram-3-fill"></i> CRM System
    </a>
    <button class="theme-btn" onclick="toggleTheme()">
        <i class="bi bi-moon-fill" id="theme-icon"></i>
    </button>
</div>

<!-- FORM -->
<div class="page-wrap">
    <div class="form-card">

        <!-- HEADER — shows lead's avatar initial -->
        <div class="card-header">
            <div class="header-avatar" id="avatarLetter">
                {{ lead.name|first|upper }}
            </div>
            <div>
                <h1>Edit Lead</h1>
                <p>{{ lead.name }} &nbsp;·&nbsp; {{ lead.company }}</p>
            </div>
        </div>

        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <!-- Name + Phone -->
                <div class="field-row">
                    <div class="field-group">
                        <label class="field-label">Full Name</label>
                        <div class="field-wrap">
                            <i class="bi bi-person field-icon"></i>
                            <input type="text" name="name" value="{{ lead.name }}" required>
                        </div>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Phone</label>
                        <div class="field-wrap">
                            <i class="bi bi-telephone field-icon"></i>
                            <input type="text" name="phone" value="{{ lead.phone }}">
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div class="field-group">
                    <label class="field-label">Email Address</label>
                    <div class="field-wrap">
                        <i class="bi bi-envelope field-icon"></i>
                        <input type="email" name="email" value="{{ lead.email }}" required>
                    </div>
                </div>

                <!-- Company -->
                <div class="field-group">
                    <label class="field-label">Company Name</label>
                    <div class="field-wrap">
                        <i class="bi bi-building field-icon"></i>
                        <input type="text" name="company" value="{{ lead.company }}">
                    </div>
                </div>

                <!-- Message -->
                <div class="field-group">
                    <label class="field-label">Message</label>
                    <div class="field-wrap">
                        <i class="bi bi-chat-left-text field-icon top"></i>
                        <textarea name="message">{{ lead.message }}</textarea>
                    </div>
                </div>

                <hr class="divider">

                <!-- Status -->
                <div class="field-group">
                    <label class="field-label">Pipeline Status</label>
                    <div class="field-wrap">
                        <i class="bi bi-flag field-icon"></i>
                        <select name="status" id="statusSelect" onchange="updateStatusColor(this)">
                            <option value="new"       {% if lead.status == "new" %}selected{% endif %}>⭐ New</option>
                            <option value="contacted" {% if lead.status == "contacted" %}selected{% endif %}>💬 Contacted</option>
                            <option value="progress"  {% if lead.status == "progress" %}selected{% endif %}>⏳ In Progress</option>
                            <option value="converted" {% if lead.status == "converted" %}selected{% endif %}>🏆 Converted</option>
                        </select>
                        <i class="bi bi-chevron-down select-arrow"></i>
                    </div>
                </div>

                <!-- BUTTONS -->
                <div class="btn-row">
                    <a href="{% url 'dashboard' %}" class="cancel-btn">
                        <i class="bi bi-x-lg"></i> Cancel
                    </a>
                    <button type="submit" class="submit-btn">
                        <i class="bi bi-check-lg"></i> Save Changes
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
// Dark mode
function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('theme-icon').className = isDark ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
}
const saved = localStorage.getItem('theme');
if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('theme-icon').className = saved === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
}

// Status color on select change
function updateStatusColor(sel) {
    const colors = {
        new: '#d97706', contacted: '#2563eb',
        progress: '#db2777', converted: '#059669'
    };
    sel.style.color = colors[sel.value] || '';
}
// Run on load
updateStatusColor(document.getElementById('statusSelect'));
</script>

</body>
</html>
